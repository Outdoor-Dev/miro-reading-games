</style><main><div class="shot" role="img" aria-label="Guests sit down to Thanksgiving dinner"></div><div class="copy"><h1>Dinner is served.</h1><p role="status">Or so we thought.</p><button type="button">Start the scene</button><p class="signed">Monica</p></div></main>
<script>
const frames=[
 ['Dinner is served.','Or so we thought.','Guests sit down to Thanksgiving dinner'],
 ['Nobody move.','Too late.','The turkey runs down the table as dishes fly and the curtain catches fire'],
 ['That was the window.','There goes dinner.','The turkey breaks through the window as guests stare'],
 ['Happy Thanksgiving, Air Tutors!','Hopefully yours wasn’t as chaotic as mine.','The guests look back in stunned silence']
];
const shot=document.querySelector('.shot'),title=document.querySelector('h1'),line=document.querySelector('[role=status]'),button=document.querySelector('button');
let frame=0;
function show(next){
 frame=next;
 const [heading,caption,description]=frames[frame];
 shot.dataset.shot=frame;
 shot.setAttribute('aria-label',description);
 title.textContent=heading;
 line.textContent=caption;
}
button.addEventListener('click',()=>{
 show(0);
 button.disabled=true;
 button.textContent='Dinner in progress…';
 setTimeout(()=>show(1),2400);
 setTimeout(()=>show(2),5400);
 setTimeout(()=>{show(3);button.disabled=false;button.textContent='Replay';},8700);
});
</script></html>
