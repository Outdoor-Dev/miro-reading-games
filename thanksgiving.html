<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanksgiving Dinner Has Left the Table</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:14px;background:#33231b;color:#372319;font:17px system-ui,sans-serif;text-align:center}main{width:min(100%,680px);background:#fff1d5;border:2px solid #ebac5d;border-radius:23px;padding:16px;box-shadow:0 18px 48px #180f0ba0}h1{font:700 clamp(30px,6vw,52px)/1 Georgia,serif;margin:5px 0 10px}.to{font-weight:750;color:#833e26}.scene{position:relative;isolation:isolate;overflow:hidden;height:clamp(190px,44vw,275px);background:repeating-linear-gradient(90deg,#f3b185 0 34px,#ffd9ad 34px 68px);border:3px solid #995739;border-radius:14px}.table{position:absolute;inset:58% 0 0;background:repeating-linear-gradient(90deg,#a35536 0 25px,#ab5e40 25px 50px);border-top:8px solid #743722}.plate{position:absolute;left:48%;top:52%;width:24%;height:20%;transform:translateX(-50%);border:5px solid #e6d7a7;border-radius:50%;background:#fff8dc}.prop,.dinner,.turkey,.chaos{position:absolute;line-height:1;font-size:clamp(26px,7vw,53px)}.dinner,.turkey{left:48%;top:44%;transform:translate(-50%,-50%);z-index:3;font-size:clamp(43px,11vw,80px)}.turkey{opacity:0}.candle{left:65%;top:34%;transform-origin:50% 90%;z-index:2}.pie{left:14%;top:59%}.peas{left:77%;top:63%}.glass{left:26%;top:34%}.fire,.smoke{opacity:0}.fire{left:72%;top:48%}.smoke{left:76%;top:32%}.running .dinner,.finished .dinner{visibility:hidden}.running .turkey{animation:escape 3s both}.running .candle,.finished .candle{transform:rotate(82deg) translateY(-12px);transition:transform .35s 1.03s}.running .pie,.finished .pie{transform:translate(-18px,-56px) rotate(-35deg);transition:transform .4s .55s}.running .glass,.finished .glass{transform:translate(-22px,30px) rotate(-85deg);transition:transform .4s .55s}.running .peas,.finished .peas{transform:translate(19px,-45px) rotate(60deg);transition:transform .4s 1s}.running .fire{animation:flare 1.6s 1.32s both}.running .smoke,.finished .smoke{animation:smoke 1.4s 1.65s both}.finished .turkey{opacity:1;left:94%;top:28%;transform:translate(-50%,-50%) rotate(13deg) scale(.8)}@keyframes escape{0%{opacity:1;left:48%;top:44%}18%{left:43%;top:22%;transform:translate(-50%,-50%) rotate(-12deg)}36%{left:18%;top:54%}59%{left:69%;top:37%;transform:translate(-50%,-50%) rotate(16deg)}79%{left:78%;top:59%}100%{opacity:1;left:94%;top:28%;transform:translate(-50%,-50%) rotate(13deg) scale(.8)}}@keyframes flare{0%,100%{opacity:0}20%,65%{opacity:1;transform:scale(1.24)}}@keyframes smoke{0%{opacity:0}60%{opacity:.9;transform:translateY(-20px) scale(1.2)}100%{opacity:.6;transform:translateY(-32px) scale(1.35)}}button{background:#813c26;color:#fff4da;border:0;border-radius:11px;padding:11px 17px;font:750 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid #362218;outline-offset:3px}#caption{min-height:3em;margin:11px 0 4px;font-weight:750}.sign{margin:10px 0 0;font:italic 17px Georgia,serif}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.finished .smoke{opacity:.6}}
</style><main><div class="to">To the Air Tutors team</div><h1>Happy Thanksgiving!</h1><div class="scene" aria-hidden="true"><div class="table"></div><div class="plate"></div><span class="prop pie">🥧</span><span class="prop glass">🥂</span><span class="prop candle">🕯️</span><span class="prop peas">🥗</span><span class="dinner">🍗</span><span class="turkey">🦃</span><span class="chaos fire">🔥</span><span class="chaos smoke">💨</span></div><p id="caption" role="status">Dinner’s ready. The turkey has other plans.</p><button type="button">Serve dinner</button><p class="sign">Monica</p></main><script>
const scene=document.querySelector('.scene');const caption=document.querySelector('#caption');const button=document.querySelector('button');const reduced=matchMedia('(prefers-reduced-motion: reduce)');let timeouts=[];
function finish(){scene.classList.add('finished');caption.textContent='Hope your Thanksgiving was a little less chaotic than this. Thanks for making me feel so welcome!';button.textContent='Replay the escape';button.disabled=false;}
button.addEventListener('click',()=>{timeouts.forEach(clearTimeout);timeouts=[];scene.className='scene';button.disabled=true;caption.textContent='Wait. Did the turkey just get up?';if(reduced.matches){finish();return;}void scene.offsetWidth;scene.classList.add('running');timeouts.push(setTimeout(()=>{caption.textContent='Pie down. Candle down. Turkey OUT.';},1450),setTimeout(finish,3050));});
</script></html>
