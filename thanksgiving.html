<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Happy Thanksgiving, Air Tutors!</title><style>
*{box-sizing:border-box} body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:#532e25 radial-gradient(ellipse at top,#955339,transparent 75%);color:#492d22;font:18px system-ui,sans-serif;text-align:center} main{position:relative;overflow:hidden;background:#fff4d9;border:2px solid #e6af5c;border-radius:28px;width:min(100%,580px);padding:32px 22px;box-shadow:0 20px 65px #24110b70} h1{font:700 clamp(36px,8vw,65px)/.98 Georgia,serif;margin:14px 0 20px} p{margin:10px auto;max-width:36ch;line-height:1.5} .team{font-weight:800;color:#7d3623}.turkey{display:block;font-size:74px;line-height:1.25}.hop{animation:hop .55s ease}@keyframes hop{50%{transform:translateY(-16px) rotate(-10deg)}}button{background:#7d3623;color:#fff4d9;border:0;border-radius:12px;padding:12px 18px;font:700 16px system-ui;cursor:pointer;margin-top:8px}button:focus-visible{outline:3px solid #392118;outline-offset:4px}#joke{min-height:3em;font-weight:700}.sign{font-family:Georgia,serif;font-style:italic}.leaf{position:absolute;top:-28px;pointer-events:none;animation:fall 1.2s ease-in both}@keyframes fall{to{transform:translateY(490px) rotate(310deg);opacity:0}}@media(prefers-reduced-motion:reduce){.hop,.leaf{animation:none}.leaf{display:none}}
</style><main><div class="team">To the Air Tutors team</div><h1>Happy Thanksgiving!</h1><span class="turkey" aria-hidden="true">🦃</span><p>Thanks for making a new tutor feel so welcome. Hope your plates are full and your Wi-Fi behaves.</p><button type="button">Unmute the turkey</button><p id="joke" role="status"></p><p class="sign">Monica</p></main><script>
const turkey=document.querySelector('.turkey');const button=document.querySelector('button');const joke=document.querySelector('#joke');const card=document.querySelector('main');const jokes=['Gobble gobble! Wait… was I on mute?', 'I brought the stuffing. I forgot to share my screen.', 'I would like to thank everyone who ordered pizza.'];let turn=0;button.addEventListener('click',()=>{joke.textContent=jokes[turn];turn=(turn+1)%jokes.length;button.textContent='Let it gobble again';turkey.classList.remove('hop');void turkey.offsetWidth;turkey.classList.add('hop');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<9;i++){const leaf=document.createElement('span');leaf.className='leaf';leaf.textContent=i%2?'🍁':'🍂';leaf.setAttribute('aria-hidden','true');leaf.style.left=(5+i*11)+'%';leaf.style.animationDelay=(i%4)*.07+'s';card.append(leaf);setTimeout(()=>leaf.remove(),1550);}});
</script></html>
