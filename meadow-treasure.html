<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open the Meadow Treasure</title>
<style>
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 8px; background: #dff4eb; color: #102039; font: 1rem system-ui, sans-serif; text-align: center }
main { position: relative; overflow: hidden; width: min(100%, 620px); padding: clamp(10px, 3vw, 26px); border: 2px solid #ba8d3b; border-radius: 22px; background: #fff8e5 }
h1 { margin: 3px 0 5px; font-size: clamp(1.4rem, 5vw, 2.6rem); line-height: 1.05 }
p { margin: 5px 0 }
.label { color: #12675d; font-weight: 750 }
.treasure { position: relative; width: 114px; margin: 4px auto; height: 125px }
.lid, .base { position: absolute; left: 8px; width: 98px; border: 4px solid #65411b; background: linear-gradient(90deg,#ad6328 15%,#eab23f 15% 24%,#ad6328 24% 76%,#eab23f 76% 85%,#ad6328 85%) }
.lid { top: 73px; height: 24px; border-radius: 18px 18px 4px 4px; transform-origin: left bottom; transition: transform .35s }
.base { top: 95px; height: 29px; border-radius: 3px 3px 10px 10px }
.lock { position: absolute; left: 41%; top: -10px; width: 18%; height: 19px; border: 2px solid #65411b; border-radius: 4px; background: #ffe582 }
.open .lid { transform: rotate(-38deg) }
.medal { position: absolute; top: 43px; left: 50%; display: grid; place-items: center; width: 68px; height: 68px; margin-left: -34px; border: 4px solid #9a5e12; border-radius: 50%; background: radial-gradient(circle at 35% 25%, #fff4a7, #ffbe30); color: #754609; font-size: 40px; opacity: 0; transform: translateY(44px) scale(.35); box-shadow: 0 0 18px #ffc83d; }
.open .medal { animation: rise .65s .16s cubic-bezier(.2,.8,.25,1.2) both }
@keyframes rise { to { opacity: 1; transform: translateY(-40px) scale(1) } }
.open .base { box-shadow: 0 -12px 30px #ffc400 }
button { font: inherit; font-weight: 750; cursor: pointer; padding: 7px 14px; border: 2px solid #12675d; border-radius: 9px; background: #aef0db; color: #102039 }
button:focus-visible { outline: 3px solid #102039; outline-offset: 2px }
#reset { border: 0; background: transparent; text-decoration: underline; padding-inline: 8px }
#badge { font-weight: 800; color: #694411; margin: 4px 0 }
.spark { position: absolute; left: 50%; top: 48%; font-size: 25px; color: #a86a00; pointer-events: none; animation: scatter .9s ease-out both }
@keyframes scatter { to { transform: translate(var(--x), var(--y)) rotate(140deg); opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .lid { transition: none } .open .medal { animation: none; opacity: 1; transform: translateY(-40px) } .spark { display: none } }
</style>
</head>
<body>
<main>
<p class="label">King of the Meadow</p>
<h1>Open the Meadow Treasure</h1>
<p>How does the king help the flowers? Underline one clue in paragraph 17.</p>
<div class="treasure" id="chest" aria-hidden="true"><div class="lid"></div><div class="medal">★</div><div class="base"><div class="lock"></div></div></div>
<div id="badge" role="status"></div>
<button type="button" id="open">Open the Chest</button>
<button type="button" id="reset" hidden>Reset</button>
</main>
<script>
const game = document.querySelector('main');
const chest = document.querySelector('#chest');
const badge = document.querySelector('#badge');
const openButton = document.querySelector('#open');
const resetButton = document.querySelector('#reset');

openButton.addEventListener('click', () => {
  if (chest.classList.contains('open')) return;
  chest.classList.add('open');
  badge.textContent = '🏅 Meadow Detectives!';
  openButton.hidden = true;
  resetButton.hidden = false;
  resetButton.focus();
  for (let i = 0; i < 18; i++) {
    const angle = i * Math.PI / 9;
    const star = document.createElement('span');
    star.className = 'spark';
    star.textContent = '✦';
    star.setAttribute('aria-hidden', 'true');
    star.style.setProperty('--x', Math.cos(angle) * 155 + 'px');
    star.style.setProperty('--y', Math.sin(angle) * 100 + 'px');
    game.append(star);
    setTimeout(() => star.remove(), 950);
  }
});

resetButton.addEventListener('click', () => {
  chest.classList.remove('open');
  badge.textContent = '';
  game.querySelectorAll('.spark').forEach(star => star.remove());
  resetButton.hidden = true;
  openButton.hidden = false;
  openButton.focus();
});
</script>
</body>
</html>
